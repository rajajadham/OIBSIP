<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Temperature Converter by Raja Jadham"
    >

    <title>Temperature Converter | Raja Jadham</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="#" class="logo">
                RJ<span>.</span>
            </a>

            <span class="brand-name">
                Raja Jadham
            </span>

        </div>

    </header>


    <!-- Main -->

    <main>

        <section class="converter-section">

            <div class="container">

                <div class="intro">

                    <p class="section-label">
                        OIBSIP • LEVEL 1 • TASK 3
                    </p>

                    <h1>
                        Temperature
                        <span>Converter.</span>
                    </h1>

                    <p>
                        Convert temperatures quickly between
                        Celsius, Fahrenheit and Kelvin.
                    </p>

                </div>


                <!-- Converter Card -->

                <div class="converter-card">

                    <div class="input-group">

                        <label for="temperature">
                            Enter Temperature
                        </label>

                        <input
                            type="number"
                            id="temperature"
                            placeholder="e.g. 25"
                            step="any"
                        >

                    </div>


                    <div class="input-group">

                        <label for="unit">
                            Convert From
                        </label>

                        <select id="unit">

                            <option value="celsius">
                                Celsius (°C)
                            </option>

                            <option value="fahrenheit">
                                Fahrenheit (°F)
                            </option>

                            <option value="kelvin">
                                Kelvin (K)
                            </option>

                        </select>

                    </div>


                    <button id="convertBtn">
                        Convert Temperature
                    </button>


                    <button
                        id="clearBtn"
                        class="clear-btn"
                    >
                        Clear
                    </button>


                    <!-- Error -->

                    <div
                        id="error"
                        class="error-message"
                    ></div>


                    <!-- Result -->

                    <div
                        id="result"
                        class="result"
                    >

                        <p class="result-title">
                            Converted Temperature
                        </p>

                        <h2 id="resultValue">
                            —
                        </h2>

                    </div>

                </div>


                <!-- Conversion Info -->

                <div class="conversion-info">

                    <div>
                        <strong>°C</strong>
                        <span>Celsius</span>
                    </div>

                    <div>
                        <strong>°F</strong>
                        <span>Fahrenheit</span>
                    </div>

                    <div>
                        <strong>K</strong>
                        <span>Kelvin</span>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Raja Jadham. All Rights Reserved.
        </p>

        <p>
            HTML5 • CSS3 • JavaScript
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
